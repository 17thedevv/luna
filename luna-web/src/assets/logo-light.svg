    <path d="M 36 8 A 10 10 0 0 0 26 18 A 10 10 0 0 0 36 28 A 11 11 0 0 1 36 8 Z" fill="url(#moonGradLight)"/>
    <!-- Companion celestial star -->
    <circle cx="43" cy="11.5" r="1.5" fill="#7c3aed"/>
