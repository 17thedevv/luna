  </defs>

  <!-- L -->
  <path d="M 8 8 L 11.5 8 L 11.5 24.5 L 21 24.5 L 21 28 L 8 28 Z" fill="#0f172a"/>

  <!-- U as Crescent Moon (Weight matching L, N, A) -->
