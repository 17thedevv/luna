name: R5 exact-candidate Ubuntu qualification

on:
  workflow_dispatch:
  push:
    branches: [r5-exact-release-qualification]
    paths:
      - .github/workflows/r5-exact-release-qualification.yml
      - docs/audits/r5-qualification-2026-10-14/harness/**

permissions:
  contents: read

env:
  R5_TESTED_COMMIT: 9bda6f572fa5f9904379c08c625c28122fcd0c56
  R5_REPOSITORY_URL: https://github.com/17thedevv/luna.git
  CARGO_TERM_COLOR: never

jobs:
  ubuntu-normal:
    name: Ubuntu GNU exact-pin normal qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
      LLVM_CONFIG_PATH: /usr/lib/llvm-18/bin/llvm-config
      LLVM_HOME: /usr/lib/llvm-18
    steps:
      - name: Acquire qualification harness (separate from tested clone)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install advertised Ubuntu GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build clang-18 llvm-18-dev libclang-18-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Qualify immutable candidate from fresh detached clone
        run: >-
          python3 docs/audits/r5-qualification-2026-10-14/harness/ubuntu_qualification.py
          --lane normal --out "$RUNNER_TEMP/r5-normal"
      - name: Preserve normal gate evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-ubuntu-normal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r5-normal/evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

  ubuntu-runtime-asan:
    name: Ubuntu GNU C runtime ABI and partial-read cleanup ASan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - name: Acquire qualification harness (separate from tested clone)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install runtime GNU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build
      - name: Qualify only the sanitized C runtime at immutable candidate
        run: >-
          python3 docs/audits/r5-qualification-2026-10-14/harness/ubuntu_qualification.py
          --lane runtime-asan --out "$RUNNER_TEMP/r5-runtime-asan"
      - name: Preserve runtime ASan evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-ubuntu-runtime-asan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r5-runtime-asan/evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
